[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-canon-ccapi"
version = "0.1.0"
description = "Python client and server implementation of Canon CCAPI"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]